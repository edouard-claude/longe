[package]
name = "longe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Longe: a self-improving harness for any LLM. One binary, one REPL tool, persistent sub-agents, budgets, verification, sandbox, reflection."
license = "MIT"
default-run = "longe"

[[bin]]
name = "longe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serialize"] }
ratatui = "0.30"
crossterm = "0.29"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["clock"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
extrasafe = "0.5"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
float_cmp = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
redundant_clone = "warn"
needless_collect = "warn"
integer_division = "warn"
mutex_atomic = "warn"
arc_with_non_send_sync = "deny"
large_futures = "warn"
